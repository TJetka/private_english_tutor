<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1B2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>English Trainer</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"English Trainer","short_name":"English","start_url":".","display":"standalone","background_color":"%230E1B2A","theme_color":"%230E1B2A","icons":[{"src":"data:image/svg%2Bxml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 fill=%27%230E1B2A%27/%3E%3Ccircle cx=%2796%27 cy=%2796%27 r=%2748%27 fill=%27none%27 stroke=%27%23FFC53D%27 stroke-width=%278%27/%3E%3Ctext x=%2796%27 y=%27114%27 font-family=%27monospace%27 font-size=%2748%27 font-weight=%27700%27 fill=%27%23FFC53D%27 text-anchor=%27middle%27%3EEN%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%230E1B2A'/%3E%3Ccircle cx='96' cy='96' r='48' fill='none' stroke='%23FFC53D' stroke-width='8'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0E1B2A;
  --ink-2:#16293D;
  --ink-3:#1E3550;
  --led-bg:#091220;
  --chalk:#F2F6F8;
  --chalk-dim:#8CA3B8;
  --flood:#FFC53D;
  --pitch:#22855A;
  --card-red:#E2484D;
  --violet:#7B61FF;
  --line:rgba(242,246,248,.14);
  --r:14px;
  --pad:18px;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--chalk);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.45;
  min-height:100vh;
  overscroll-behavior-y:contain;
}
#app{max-width:480px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--flood);outline-offset:2px;border-radius:6px}

/* ---------- scoreboard (signature element) ---------- */
.board{
  margin-top:calc(10px + env(safe-area-inset-top));
  background:var(--led-bg);
  background-image:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1.2px);
  background-size:4px 4px;
  border:1px solid rgba(255,197,61,.22);
  border-radius:var(--r);
  padding:12px 14px 10px;
  box-shadow:inset 0 2px 22px rgba(0,0,0,.75);
}
.board-row{display:flex;gap:8px}
.cell{flex:1;text-align:center}
.cell-k{
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,197,61,.5);display:block;margin-bottom:2px
}
.cell-v{
  font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.02em;
  color:var(--flood);text-shadow:0 0 12px rgba(255,197,61,.55);display:block;line-height:1
}
.cell-v.sm{font-size:19px;padding-top:5px}
.board-msg{
  font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  text-align:center;margin-top:10px;padding-top:9px;border-top:1px dashed rgba(255,197,61,.2);
  color:var(--flood);text-shadow:0 0 10px rgba(255,197,61,.5);min-height:19px
}
.board-msg.good{color:#5BE39A;text-shadow:0 0 12px rgba(91,227,154,.6)}
.board-msg.bad{color:#FF8E92;text-shadow:0 0 12px rgba(226,72,77,.6)}

/* ---------- pitch lines / hero ---------- */
.hero{position:relative;margin:16px 0 14px;padding:22px 20px 20px;border-radius:var(--r);
  background:linear-gradient(170deg,var(--ink-2),var(--ink));border:1px solid var(--line);overflow:hidden}
.hero-lines{position:absolute;inset:0;opacity:.28;pointer-events:none}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--flood)}
.hero h1{margin:6px 0 2px;font-size:30px;line-height:1.05;letter-spacing:-.02em;font-weight:800}
.hero p{margin:6px 0 0;color:var(--chalk-dim);font-size:15px;position:relative}

/* ---------- buttons ---------- */
.cta{
  display:block;width:100%;margin:14px 0 0;padding:19px 18px;border-radius:var(--r);
  background:var(--flood);color:#20160A;font-size:19px;font-weight:800;letter-spacing:-.01em;
  box-shadow:0 5px 0 #C99721;transition:transform .07s,box-shadow .07s
}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #C99721}
.cta[disabled]{opacity:.45;box-shadow:0 5px 0 #7a5f18}
.cta-sub{display:block;font-size:12px;font-weight:600;opacity:.65;margin-top:3px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.ghost{
  display:block;width:100%;margin-top:10px;padding:14px;border-radius:var(--r);
  border:1px solid var(--line);color:var(--chalk-dim);font-size:15px;font-weight:600;text-align:center
}
.ghost:active{background:var(--ink-2)}

/* ---------- fixtures (week strip) ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.sec-h h2{margin:0;font-size:13px;font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--chalk-dim);font-weight:600}
.sec-h span{font-family:var(--mono);font-size:11px;color:var(--flood);letter-spacing:.1em}
.fixtures{display:grid;grid-template-columns:repeat(5,1fr) .68fr .68fr;gap:6px}
.fx{height:58px;border-radius:11px;border:1px solid var(--line);background:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.fx.bonus{background:transparent;border-style:dashed;opacity:.7}
.fx.bonus.done{background:rgba(255,197,61,.16);border-color:var(--flood);border-style:solid;opacity:1}
.fx.bonus.done b{color:var(--flood)}
.fx.bonus.done i{filter:none}
.hint{margin:9px 2px 0;font-size:12.5px;color:var(--chalk-dim);text-align:center}
.fx b{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--chalk-dim);font-weight:600}
.fx i{font-style:normal;font-size:17px;line-height:1}
.fx.done{background:rgba(34,133,90,.22);border-color:rgba(34,133,90,.6)}
.fx.done b{color:#6FD8A4}
.fx.today{border-color:var(--flood);box-shadow:0 0 0 1px var(--flood) inset}
.fx.today b{color:var(--flood)}

/* ---------- cards ---------- */
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-top:12px}
.card h3{margin:0 0 6px;font-size:16px;letter-spacing:-.01em}
.card p{margin:0;color:var(--chalk-dim);font-size:14.5px}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.badge{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;
  border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--chalk-dim);background:var(--ink-2)}
.badge.on{color:#20160A;background:var(--flood);border-color:var(--flood)}

/* ---------- session ---------- */
.q-meta{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--chalk-dim)}
.bar{height:5px;border-radius:99px;background:var(--ink-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--flood);transition:width .3s ease}
.q{
  margin-top:14px;padding:26px 20px;border-radius:var(--r);text-align:center;
  background:var(--ink-2);border:1px solid var(--line);position:relative
}
.q-tag{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--flood)}
.q-main{margin:12px 0 0;font-size:31px;font-weight:800;letter-spacing:-.02em;line-height:1.15;word-break:break-word}
.q-main.small{font-size:23px}
.q-sub{margin:9px 0 0;color:var(--chalk-dim);font-size:14px}
.speak{margin:14px auto 0;display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;
  border:1px solid rgba(255,197,61,.4);color:var(--flood);font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.speak:active{background:rgba(255,197,61,.12)}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{padding:17px 16px;border-radius:var(--r);background:var(--ink-2);border:1px solid var(--line);
  text-align:left;font-size:17px;font-weight:600;transition:background .12s,border-color .12s}
.opt:active{background:var(--ink-3)}
.opt.right{background:rgba(34,133,90,.3);border-color:var(--pitch)}
.opt.wrong{background:rgba(226,72,77,.24);border-color:var(--card-red)}
.opt.mute{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.chip{padding:11px 14px;border-radius:10px;background:var(--ink-3);border:1px solid var(--line);font-weight:700;font-size:16px}
.chip.used{opacity:.25}
.slot{min-height:56px;margin-top:14px;padding:12px;border-radius:var(--r);border:1px dashed var(--line);
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center}
.slot .chip{background:var(--flood);color:#20160A;border-color:var(--flood)}
.slot em{color:var(--chalk-dim);font-style:normal;font-size:14px}
.typed{width:100%;margin-top:14px;padding:16px;border-radius:var(--r);background:var(--ink-3);
  border:1px solid var(--line);color:var(--chalk);font-size:22px;font-weight:700;text-align:center;letter-spacing:.02em}
.fb{margin-top:12px;padding:14px 16px;border-radius:var(--r);font-size:15px;font-weight:600}
.fb.good{background:rgba(34,133,90,.22);border:1px solid var(--pitch)}
.fb.bad{background:rgba(226,72,77,.18);border:1px solid var(--card-red)}
.fb small{display:block;font-weight:500;color:var(--chalk-dim);margin-top:4px;font-size:13.5px}

/* ---------- result ---------- */
.result{margin-top:20px;padding:26px 20px;border-radius:var(--r);text-align:center;
  background:linear-gradient(170deg,var(--ink-2),var(--ink));border:1px solid rgba(255,197,61,.3)}
.score{font-family:var(--mono);font-size:52px;font-weight:700;color:var(--flood);
  text-shadow:0 0 20px rgba(255,197,61,.4);letter-spacing:.04em;line-height:1}
.result h2{margin:10px 0 4px;font-size:24px;letter-spacing:-.02em}
.result p{margin:0;color:var(--chalk-dim);font-size:14.5px}
.xp{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:999px;background:rgba(255,197,61,.14);
  color:var(--flood);font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}

/* ---------- parent ---------- */
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.tbl th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--chalk-dim);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid rgba(242,246,248,.06)}
.pill{display:inline-block;min-width:58px;text-align:center;padding:3px 8px;border-radius:99px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.p0{background:rgba(226,72,77,.2);color:#FF9DA0}
.p1{background:rgba(255,197,61,.16);color:var(--flood)}
.p2{background:rgba(34,133,90,.25);color:#6FD8A4}
textarea{width:100%;min-height:110px;margin-top:8px;padding:12px;border-radius:10px;background:var(--led-bg);
  border:1px solid var(--line);color:var(--chalk-dim);font-family:var(--mono);font-size:11px}
.note{font-size:13px;color:var(--chalk-dim);margin-top:10px}
.foot{margin-top:26px;text-align:center}
.foot button{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#4E6478}
.flash{animation:fl .5s ease}
@keyframes fl{0%{transform:scale(.97);opacity:.5}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Pilot controls share the original mobile layout. */
label{display:block;margin-top:14px;color:var(--chalk-dim);font-size:14px}
select,input[type=url]{width:100%;padding:12px;margin-top:6px;border-radius:10px;background:var(--ink-3);color:var(--chalk);border:1px solid var(--line);font:inherit}
input[type=file]{max-width:100%;margin-top:10px;font-size:14px}
summary{cursor:pointer;margin-top:14px;color:var(--flood)}
li{margin-bottom:8px;font-size:15px}
button:disabled{cursor:default;opacity:.55}
.foot button{color:var(--chalk-dim);min-height:44px}
#message:empty{display:none}
#message{color:var(--flood)}
</style>
</head>
<body>
<div id="app"></div>

<script type="module" src="src/app.mjs"></script>
</body>
</html>
