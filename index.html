<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1B2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>English Trainer</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"English Trainer","short_name":"English","start_url":".","display":"standalone","background_color":"%230E1B2A","theme_color":"%230E1B2A","icons":[{"src":"data:image/svg%2Bxml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 fill=%27%230E1B2A%27/%3E%3Ccircle cx=%2796%27 cy=%2796%27 r=%2748%27 fill=%27none%27 stroke=%27%23FFC53D%27 stroke-width=%278%27/%3E%3Ctext x=%2796%27 y=%27114%27 font-family=%27monospace%27 font-size=%2748%27 font-weight=%27700%27 fill=%27%23FFC53D%27 text-anchor=%27middle%27%3EEN%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%230E1B2A'/%3E%3Ccircle cx='96' cy='96' r='48' fill='none' stroke='%23FFC53D' stroke-width='8'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#0E1B2A;
  --ink-2:#16293D;
  --ink-3:#1E3550;
  --led-bg:#091220;
  --chalk:#F2F6F8;
  --chalk-dim:#8CA3B8;
  --flood:#FFC53D;
  --pitch:#22855A;
  --card-red:#E2484D;
  --violet:#7B61FF;
  --line:rgba(242,246,248,.14);
  --r:14px;
  --pad:18px;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--chalk);
  font-family:var(--sans);
  font-size:17px;
  line-height:1.45;
  min-height:100vh;
  overscroll-behavior-y:contain;
}
#app{max-width:480px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--flood);outline-offset:2px;border-radius:6px}

/* ---------- scoreboard (signature element) ---------- */
.board{
  margin-top:calc(10px + env(safe-area-inset-top));
  background:var(--led-bg);
  background-image:radial-gradient(circle,rgba(255,255,255,.055) 1px,transparent 1.2px);
  background-size:4px 4px;
  border:1px solid rgba(255,197,61,.22);
  border-radius:var(--r);
  padding:12px 14px 10px;
  box-shadow:inset 0 2px 22px rgba(0,0,0,.75);
}
.board-row{display:flex;gap:8px}
.cell{flex:1;text-align:center}
.cell-k{
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,197,61,.5);display:block;margin-bottom:2px
}
.cell-v{
  font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.02em;
  color:var(--flood);text-shadow:0 0 12px rgba(255,197,61,.55);display:block;line-height:1
}
.cell-v.sm{font-size:19px;padding-top:5px}
.board-msg{
  font-family:var(--mono);font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  text-align:center;margin-top:10px;padding-top:9px;border-top:1px dashed rgba(255,197,61,.2);
  color:var(--flood);text-shadow:0 0 10px rgba(255,197,61,.5);min-height:19px
}
.board-msg.good{color:#5BE39A;text-shadow:0 0 12px rgba(91,227,154,.6)}
.board-msg.bad{color:#FF8E92;text-shadow:0 0 12px rgba(226,72,77,.6)}

/* ---------- pitch lines / hero ---------- */
.hero{position:relative;margin:16px 0 14px;padding:22px 20px 20px;border-radius:var(--r);
  background:linear-gradient(170deg,var(--ink-2),var(--ink));border:1px solid var(--line);overflow:hidden}
.hero-lines{position:absolute;inset:0;opacity:.28;pointer-events:none}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--flood)}
.hero h1{margin:6px 0 2px;font-size:30px;line-height:1.05;letter-spacing:-.02em;font-weight:800}
.hero p{margin:6px 0 0;color:var(--chalk-dim);font-size:15px;position:relative}

/* ---------- buttons ---------- */
.cta{
  display:block;width:100%;margin:14px 0 0;padding:19px 18px;border-radius:var(--r);
  background:var(--flood);color:#20160A;font-size:19px;font-weight:800;letter-spacing:-.01em;
  box-shadow:0 5px 0 #C99721;transition:transform .07s,box-shadow .07s
}
.cta:active{transform:translateY(4px);box-shadow:0 1px 0 #C99721}
.cta[disabled]{opacity:.45;box-shadow:0 5px 0 #7a5f18}
.cta-sub{display:block;font-size:12px;font-weight:600;opacity:.65;margin-top:3px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase}
.ghost{
  display:block;width:100%;margin-top:10px;padding:14px;border-radius:var(--r);
  border:1px solid var(--line);color:var(--chalk-dim);font-size:15px;font-weight:600;text-align:center
}
.ghost:active{background:var(--ink-2)}

/* ---------- fixtures (week strip) ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.sec-h h2{margin:0;font-size:13px;font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--chalk-dim);font-weight:600}
.sec-h span{font-family:var(--mono);font-size:11px;color:var(--flood);letter-spacing:.1em}
.fixtures{display:grid;grid-template-columns:repeat(5,1fr) .68fr .68fr;gap:6px}
.fx{height:58px;border-radius:11px;border:1px solid var(--line);background:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.fx.bonus{background:transparent;border-style:dashed;opacity:.7}
.fx.bonus.done{background:rgba(255,197,61,.16);border-color:var(--flood);border-style:solid;opacity:1}
.fx.bonus.done b{color:var(--flood)}
.fx.bonus.done i{filter:none}
.hint{margin:9px 2px 0;font-size:12.5px;color:var(--chalk-dim);text-align:center}
.fx b{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--chalk-dim);font-weight:600}
.fx i{font-style:normal;font-size:17px;line-height:1}
.fx.done{background:rgba(34,133,90,.22);border-color:rgba(34,133,90,.6)}
.fx.done b{color:#6FD8A4}
.fx.today{border-color:var(--flood);box-shadow:0 0 0 1px var(--flood) inset}
.fx.today b{color:var(--flood)}

/* ---------- cards ---------- */
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);margin-top:12px}
.card h3{margin:0 0 6px;font-size:16px;letter-spacing:-.01em}
.card p{margin:0;color:var(--chalk-dim);font-size:14.5px}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.badge{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;
  border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--chalk-dim);background:var(--ink-2)}
.badge.on{color:#20160A;background:var(--flood);border-color:var(--flood)}

/* ---------- session ---------- */
.q-meta{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 8px;
  font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--chalk-dim)}
.bar{height:5px;border-radius:99px;background:var(--ink-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--flood);transition:width .3s ease}
.q{
  margin-top:14px;padding:26px 20px;border-radius:var(--r);text-align:center;
  background:var(--ink-2);border:1px solid var(--line);position:relative
}
.q-tag{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--flood)}
.q-main{margin:12px 0 0;font-size:31px;font-weight:800;letter-spacing:-.02em;line-height:1.15;word-break:break-word}
.q-main.small{font-size:23px}
.q-sub{margin:9px 0 0;color:var(--chalk-dim);font-size:14px}
.speak{margin:14px auto 0;display:flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;
  border:1px solid rgba(255,197,61,.4);color:var(--flood);font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.speak:active{background:rgba(255,197,61,.12)}
.opts{display:grid;gap:9px;margin-top:14px}
.opt{padding:17px 16px;border-radius:var(--r);background:var(--ink-2);border:1px solid var(--line);
  text-align:left;font-size:17px;font-weight:600;transition:background .12s,border-color .12s}
.opt:active{background:var(--ink-3)}
.opt.right{background:rgba(34,133,90,.3);border-color:var(--pitch)}
.opt.wrong{background:rgba(226,72,77,.24);border-color:var(--card-red)}
.opt.mute{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.chip{padding:11px 14px;border-radius:10px;background:var(--ink-3);border:1px solid var(--line);font-weight:700;font-size:16px}
.chip.used{opacity:.25}
.slot{min-height:56px;margin-top:14px;padding:12px;border-radius:var(--r);border:1px dashed var(--line);
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center}
.slot .chip{background:var(--flood);color:#20160A;border-color:var(--flood)}
.slot em{color:var(--chalk-dim);font-style:normal;font-size:14px}
.typed{width:100%;margin-top:14px;padding:16px;border-radius:var(--r);background:var(--ink-3);
  border:1px solid var(--line);color:var(--chalk);font-size:22px;font-weight:700;text-align:center;letter-spacing:.02em}
.fb{margin-top:12px;padding:14px 16px;border-radius:var(--r);font-size:15px;font-weight:600}
.fb.good{background:rgba(34,133,90,.22);border:1px solid var(--pitch)}
.fb.bad{background:rgba(226,72,77,.18);border:1px solid var(--card-red)}
.fb small{display:block;font-weight:500;color:var(--chalk-dim);margin-top:4px;font-size:13.5px}

/* ---------- result ---------- */
.result{margin-top:20px;padding:26px 20px;border-radius:var(--r);text-align:center;
  background:linear-gradient(170deg,var(--ink-2),var(--ink));border:1px solid rgba(255,197,61,.3)}
.score{font-family:var(--mono);font-size:52px;font-weight:700;color:var(--flood);
  text-shadow:0 0 20px rgba(255,197,61,.4);letter-spacing:.04em;line-height:1}
.result h2{margin:10px 0 4px;font-size:24px;letter-spacing:-.02em}
.result p{margin:0;color:var(--chalk-dim);font-size:14.5px}
.xp{display:inline-block;margin-top:14px;padding:8px 14px;border-radius:999px;background:rgba(255,197,61,.14);
  color:var(--flood);font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}

/* ---------- parent ---------- */
.tbl{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.tbl th{text-align:left;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--chalk-dim);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 4px;border-bottom:1px solid rgba(242,246,248,.06)}
.pill{display:inline-block;min-width:58px;text-align:center;padding:3px 8px;border-radius:99px;
  font-family:var(--mono);font-size:10px;letter-spacing:.06em}
.p0{background:rgba(226,72,77,.2);color:#FF9DA0}
.p1{background:rgba(255,197,61,.16);color:var(--flood)}
.p2{background:rgba(34,133,90,.25);color:#6FD8A4}
textarea{width:100%;min-height:110px;margin-top:8px;padding:12px;border-radius:10px;background:var(--led-bg);
  border:1px solid var(--line);color:var(--chalk-dim);font-family:var(--mono);font-size:11px}
.note{font-size:13px;color:var(--chalk-dim);margin-top:10px}
.foot{margin-top:26px;text-align:center}
.foot button{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#4E6478}
.flash{animation:fl .5s ease}
@keyframes fl{0%{transform:scale(.97);opacity:.5}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   ENGLISH TRAINER  v1
   Pre-A1 (Cambridge Starters-aligned) daily drill.
   Single file. No dependencies. No login. localStorage + memory fallback.
   Content: original items written on the public Starters wordlist.
   ============================================================ */

/* ---------- 1. CONTENT ---------- */
const CONTENT = {
  weeks: [
    {
      id: 1,
      title: "Kick-off",
      sub: "Cześć, imię, liczby 1-6",
      grammar: {
        t: "I'm ... / It's a ...",
        b: "I'm = jestem albo mam (o wieku). It's a = to jest. Po 'a' idzie jedna rzecz: a ball, a boy."
      },
      words: [
        {id:"hello",   en:"hello",   pl:"cześć"},
        {id:"goodbye", en:"goodbye", pl:"do widzenia"},
        {id:"name",    en:"name",    pl:"imię"},
        {id:"friend",  en:"friend",  pl:"kolega"},
        {id:"ball",    en:"ball",    pl:"piłka"},
        {id:"play",    en:"play",    pl:"grać"},
        {id:"big",     en:"big",     pl:"duży"},
        {id:"small",   en:"small",   pl:"mały"},
        {id:"boy",     en:"boy",     pl:"chłopiec"},
        {id:"girl",    en:"girl",    pl:"dziewczynka"},
        {id:"yes",     en:"yes",     pl:"tak"},
        {id:"no",      en:"no",      pl:"nie"},
        {id:"one",     en:"one",     pl:"jeden"},
        {id:"two",     en:"two",     pl:"dwa"},
        {id:"three",   en:"three",   pl:"trzy"},
        {id:"four",    en:"four",    pl:"cztery"},
        {id:"five",    en:"five",    pl:"pięć"},
        {id:"six",     en:"six",     pl:"sześć"}
      ],
      sentences: [
        {id:"s1a", en:"My name is Tomek.", pl:"Nazywam się Tomek.",
         gap:{q:"My name ___ Tomek.", a:"is", o:["is","am","are"]}},
        {id:"s1b", en:"I'm ten.", pl:"Mam dziesięć lat.",
         gap:{q:"___ ten.", a:"I'm", o:["I'm","It's","My"]}},
        {id:"s1c", en:"It's a big ball.", pl:"To duża piłka.",
         gap:{q:"It's ___ big ball.", a:"a", o:["a","the","is"]}},
        {id:"s1d", en:"I play football.", pl:"Gram w piłkę nożną.",
         gap:{q:"I ___ football.", a:"play", o:["play","plays","playing"]}},
        {id:"s1e", en:"My friend has a small ball.", pl:"Mój kolega ma małą piłkę.",
         gap:{q:"My friend ___ a small ball.", a:"has", o:["has","have","is"]}}
      ]
    },
    {
      id: 2,
      title: "Colours and kit",
      sub: "Kolory, liczby 7-10, liczba mnoga",
      grammar: {
        t: "a / an + liczba mnoga",
        b: "Jedna rzecz: a shirt. Przed a,e,i,o,u mówimy an: an owl. Więcej rzeczy: dodaj -s (two shirts) i mów They're."
      },
      words: [
        {id:"red",    en:"red",    pl:"czerwony"},
        {id:"blue",   en:"blue",   pl:"niebieski"},
        {id:"green",  en:"green",  pl:"zielony"},
        {id:"yellow", en:"yellow", pl:"żółty"},
        {id:"black",  en:"black",  pl:"czarny"},
        {id:"white",  en:"white",  pl:"biały"},
        {id:"shirt",  en:"shirt",  pl:"koszulka"},
        {id:"sock",   en:"sock",   pl:"skarpetka"},
        {id:"hat",    en:"hat",    pl:"czapka"},
        {id:"block",  en:"block",  pl:"klocek"},
        {id:"owl",    en:"owl",    pl:"sowa"},
        {id:"cat",    en:"cat",    pl:"kot"},
        {id:"seven",  en:"seven",  pl:"siedem"},
        {id:"eight",  en:"eight",  pl:"osiem"},
        {id:"nine",   en:"nine",   pl:"dziewięć"},
        {id:"ten",    en:"ten",    pl:"dziesięć"}
      ],
      sentences: [
        {id:"s2a", en:"It's a red shirt.", pl:"To czerwona koszulka.",
         gap:{q:"It's ___ red shirt.", a:"a", o:["a","an","two"]}},
        {id:"s2b", en:"They're blue socks.", pl:"To niebieskie skarpetki.",
         gap:{q:"They're blue ___.", a:"socks", o:["socks","sock","a sock"]}},
        {id:"s2c", en:"I've got an owl.", pl:"Mam sowę.",
         gap:{q:"I've got ___ owl.", a:"an", o:["an","a","the"]}},
        {id:"s2d", en:"The ball is black and white.", pl:"Piłka jest czarno-biała.",
         gap:{q:"The ball ___ black and white.", a:"is", o:["is","are","am"]}},
        {id:"s2e", en:"I build with green blocks.", pl:"Buduję z zielonych klocków.",
         gap:{q:"I build with green ___.", a:"blocks", o:["blocks","block","a block"]}},
        {id:"s2f", en:"My cat has a yellow hat.", pl:"Mój kot ma żółtą czapkę.",
         gap:{q:"My cat ___ a yellow hat.", a:"has", o:["has","have","is"]}}
      ]
    }
  ]
};

const CFG = {
  newPerSession: 5,
  maxExercises: 20,
  intervals: [0, 1, 2, 4, 8],   // Leitner box -> days until due
  weeklyTarget: 5,
  xpRight: 10,
  xpWrong: 2
};

/* ---------- 2. STORAGE (localStorage with memory fallback) ---------- */
const KEY = "eng-trainer-v1";
let mem = null;
function canStore(){
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); return true; }
  catch(e){ return false; }
}
const HAS_LS = canStore();
function load(){
  if (HAS_LS){
    try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; }
    catch(e){ return null; }
  }
  return mem;
}
function save(s){
  if (HAS_LS){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e){} }
  else { mem = s; }
}

/* ---------- 3. STATE ---------- */
function today(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function dayNum(iso){ return Math.round(Date.parse(iso + "T00:00:00Z") / 864e5); }
function isoOf(dn){ return new Date(dn * 864e5).toISOString().slice(0,10); }
function fresh(){
  return { started: today(), week: 1, xp: 0, streak: 0, best: 0,
           last: null, dates: [], items: {}, badges: [] };
}
let S = load() || fresh();
if (!S.items) S = fresh();

function allWords(){ return CONTENT.weeks.flatMap(w => w.words.map(x => ({...x, week:w.id}))); }
function unlockedWords(){ return allWords().filter(w => w.week <= S.week); }
function masteredCount(){ return unlockedWords().filter(w => rec(w.id).box >= 3).length; }
function rec(id){
  if (!S.items[id]) S.items[id] = { box:0, due:0, ok:0, bad:0, seen:false };
  return S.items[id];
}

/* ---------- 4. SESSION BUILDER ---------- */
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a,n){ return shuffle(a).slice(0,n); }

function buildSession(){
  const d = dayNum(today());
  const pool = unlockedWords();
  const due = pool.filter(w => { const r = rec(w.id); return r.seen && r.due <= d; });
  const nw  = pool.filter(w => !rec(w.id).seen).slice(0, CFG.newPerSession);
  const make = (kind, w) => {
    const others = pool.filter(x => x.id !== w.id);
    if (kind === "en2pl") return { kind, w, prompt:w.en, tag:"Co to znaczy?", speak:w.en,
      correct:w.pl, opts:shuffle([w.pl, ...pick(others,3).map(o=>o.pl)]) };
    if (kind === "pl2en") return { kind, w, prompt:w.pl, tag:"Jak to powiedzieć?",
      correct:w.en, opts:shuffle([w.en, ...pick(others,3).map(o=>o.en)]) };
    if (kind === "listen") return { kind, w, prompt:"🔊", tag:"Posłuchaj i wybierz", speak:w.en, autoSpeak:true,
      correct:w.en, opts:shuffle([w.en, ...pick(others,3).map(o=>o.en)]) };
    return { kind:"spell", w, prompt:w.pl, tag:"Napisz po angielsku", speak:w.en, correct:w.en };
  };

  // New words: meet it first (with audio), then recall it later in the same session.
  const first = [], later = [];
  nw.forEach(w => { first.push(make("en2pl", w)); later.push(make("pl2en", w)); });

  // Review words: exercise type climbs with the Leitner box.
  const rev = due.map((w, i) => {
    const b = rec(w.id).box;
    if (b === 0) return make(i % 2 ? "listen" : "pl2en", w);
    if (b === 1) return make("listen", w);
    if (b === 2) return make("pl2en", w);
    return make("spell", w);
  });

  // Typing is slow on a phone: keep at most 5 per session, rest become listening.
  let typed = 0;
  const capped = rev.map(e => {
    if (e.kind !== "spell") return e;
    if (++typed <= 5) return e;
    return make("listen", e.w);
  });

  const ex = [...shuffle([...first, ...capped]), ...shuffle(later)];

  const wk = CONTENT.weeks.find(x => x.id === S.week) || CONTENT.weeks[0];
  const sents = pick(wk.sentences, 4);
  sents.slice(0,2).forEach(s => ex.push({
    kind:"gap", s, prompt:s.gap.q, tag:"Uzupełnij", sub:s.pl, speak:s.en,
    correct:s.gap.a, opts:shuffle(s.gap.o)
  }));
  sents.slice(2,4).forEach(s => ex.push({
    kind:"order", s, prompt:s.pl, tag:"Ułóż zdanie", speak:s.en,
    correct:s.en, tokens:shuffle(s.en.replace(/\.$/,"").split(" "))
  }));

  // Quiet review day? Top up so a session never feels stubby: spare sentences first,
  // then extra retrieval of the weakest words even though they are not due yet.
  const spare = shuffle(wk.sentences.filter(s => !sents.includes(s)));
  while (ex.length < 12 && spare.length){
    const s = spare.pop();
    ex.push({ kind:"order", s, prompt:s.pl, tag:"Ułóż zdanie", speak:s.en,
              correct:s.en, tokens:shuffle(s.en.replace(/\.$/,"").split(" ")) });
  }
  const usedIds = new Set(ex.filter(e => e.w).map(e => e.w.id));
  const extra = pool.filter(w => rec(w.id).seen && !usedIds.has(w.id))
                    .sort((a,b) => rec(a.id).box - rec(b.id).box);
  while (ex.length < 12 && extra.length){
    const w = extra.shift();
    ex.push(make(ex.length % 2 ? "listen" : "pl2en", w));
  }

  return ex.slice(0, CFG.maxExercises);
}

function grade(ex, ok){
  const id = ex.w ? ex.w.id : (ex.s ? ex.s.id : null);
  if (id){
    const r = rec(id);
    r.seen = true;
    if (ok){ r.ok++; r.box = Math.min(r.box + 1, CFG.intervals.length - 1); }
    else   { r.bad++; r.box = 0; }
    r.due = dayNum(today()) + CFG.intervals[r.box];
  }
  S.xp += ok ? CFG.xpRight : CFG.xpWrong;
  save(S);
}

/* ---------- 5. STREAK / WEEK ---------- */
function finishSession(){
  const t = today();
  if (S.last !== t){
    // A 5-day-a-week plan must survive weekends, so the streak counts sessions
    // and only breaks after more than three days without one.
    const gap = S.last ? dayNum(t) - dayNum(S.last) : 99;
    S.streak = (gap <= 3) ? S.streak + 1 : 1;
    S.best = Math.max(S.best, S.streak);
    S.last = t;
    S.dates.push(t);
  }
  const mastered = masteredCount();
  const add = n => { if (!S.badges.includes(n)) S.badges.push(n); };
  if (S.streak >= 3) add("3 treningi");
  if (S.streak >= 7) add("7 treningów");
  if (S.streak >= 30) add("30 treningów");
  if (mastered >= 20) add("20 słów");
  if (mastered >= 50) add("50 słów");
  // Unlock the next week at 80% of words solid. Demanding all of them means the
  // long tail of two or three stubborn words blocks progress indefinitely.
  const wk = CONTENT.weeks.find(x => x.id === S.week);
  if (wk){
    const solid = wk.words.filter(w => rec(w.id).box >= 2).length;
    if (solid >= Math.ceil(wk.words.length * 0.8) && S.week < CONTENT.weeks.length) S.week++;
  }
  save(S);
}
function weekDays(){
  const n = new Date(); const dow = (n.getDay() + 6) % 7;
  const mon = dayNum(today()) - dow;
  return [0,1,2,3,4,5,6].map(i => {
    const iso = isoOf(mon + i);
    return { iso, done: S.dates.includes(iso), today: iso === today(), weekend: i > 4 };
  });
}
// Any session Monday to Sunday counts toward the target of five.
function weekCount(){ return weekDays().filter(d => d.done).length; }
function doneToday(){ return S.last === today(); }

/* ---------- 6. SPEECH ---------- */
let voice = null;
function initVoice(){
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === "en-GB") || vs.find(v => v.lang.startsWith("en")) || null;
}
if ("speechSynthesis" in window){ initVoice(); speechSynthesis.onvoiceschanged = initVoice; }
function say(text){
  if (!("speechSynthesis" in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB"; u.rate = .85; if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* ---------- 7. RENDER HELPERS ---------- */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let boardMsg = "";
let boardTone = "";

function board(){
  const wk = CONTENT.weeks.find(x => x.id === S.week) || CONTENT.weeks[0];
  const done = Math.min(weekCount(), CFG.weeklyTarget);
  return `<div class="board">
    <div class="board-row">
      <div class="cell"><span class="cell-k">Seria</span><span class="cell-v">${S.streak}</span></div>
      <div class="cell"><span class="cell-k">Punkty</span><span class="cell-v">${S.xp}</span></div>
      <div class="cell"><span class="cell-k">Tydzień</span><span class="cell-v">${wk.id}</span></div>
      <div class="cell"><span class="cell-k">Ten tydz.</span><span class="cell-v sm">${done}/${CFG.weeklyTarget}</span></div>
    </div>
    <div class="board-msg ${boardTone}">${esc(boardMsg || "READY")}</div>
  </div>`;
}
const pitchSVG = `<svg class="hero-lines" viewBox="0 0 300 150" preserveAspectRatio="none" aria-hidden="true">
  <g fill="none" stroke="#F2F6F8" stroke-width="1">
    <circle cx="150" cy="75" r="34"/><line x1="150" y1="0" x2="150" y2="150"/>
    <rect x="0" y="45" width="34" height="60"/><rect x="266" y="45" width="34" height="60"/>
  </g></svg>`;

/* ---------- 8. SCREENS ---------- */
function screenHome(){
  const wk = CONTENT.weeks.find(x => x.id === S.week) || CONTENT.weeks[0];
  const days = weekDays();
  const names = ["Pon","Wt","Śr","Czw","Pt","Sob","Nd"];
  const cnt = weekCount();
  const extra = Math.max(0, cnt - CFG.weeklyTarget);
  const mastered = masteredCount();
  const total = unlockedWords().length;
  const dt = doneToday();
  const allB = ["3 treningi","7 treningów","30 treningów","20 słów","50 słów"];

  app.innerHTML = board() + `
    <div class="hero">${pitchSVG}
      <span class="eyebrow">Tydzień ${wk.id} &middot; ${esc(wk.sub)}</span>
      <h1>${esc(wk.title)}</h1>
      <p>${dt ? "Dzisiejszy trening zaliczony. Możesz zagrać jeszcze raz." : "15 minut. Jeden mecz. Zaczynamy?"}</p>
    </div>
    <button class="cta" id="go">${dt ? "Zagraj jeszcze raz" : "Zacznij trening"}
      <span class="cta-sub">${dt ? "runda dodatkowa" : "ok. 15 minut"}</span></button>

    <div class="sec-h"><h2>Ten tydzień</h2><span>${Math.min(cnt,CFG.weeklyTarget)} / ${CFG.weeklyTarget}${extra?` +${extra}`:""}</span></div>
    <div class="fixtures">${days.map((d,i)=>`
      <div class="fx ${d.weekend?"bonus":""} ${d.done?"done":""} ${d.today?"today":""}">
        <i>${d.done?"⚽":(d.today?"▶":(d.weekend?"+":"·"))}</i><b>${names[i]}</b>
      </div>`).join("")}</div>
    ${cnt<CFG.weeklyTarget?`<p class="hint">Weekend też się liczy. Możesz nadrobić w sobotę lub niedzielę.</p>`:""}

    <div class="sec-h"><h2>Odznaki</h2><span>${S.badges.length} / ${allB.length}</span></div>
    <div class="badges">${allB.map(b=>`<span class="badge ${S.badges.includes(b)?"on":""}">${S.badges.includes(b)?"★":"☆"} ${b}</span>`).join("")}</div>

    <div class="card">
      <h3>Umiesz ${mastered} z ${total} słów</h3>
      <p>Słowa, które pomylisz, wracają nazajutrz. Te, które umiesz, wracają rzadziej.</p>
      <div class="bar" style="margin-top:12px"><i style="width:${total?Math.round(mastered/total*100):0}%"></i></div>
    </div>

    <div class="card">
      <h3>Gramatyka: ${esc(wk.grammar.t)}</h3>
      <p>${esc(wk.grammar.b)}</p>
    </div>

    <div class="foot"><button id="parent">Panel rodzica</button></div>`;

  document.getElementById("go").onclick = () => startSession();
  document.getElementById("parent").onclick = screenParent;
}

let Q = { list: [], i: 0, right: 0, wrong: 0, answered: false, built: [] };

function startSession(){
  Q = { list: buildSession(), i: 0, right: 0, wrong: 0, answered: false, built: [] };
  boardMsg = "KICK OFF"; boardTone = "";
  if (!Q.list.length){ boardMsg = "BRAK ZADAŃ"; screenHome(); return; }
  renderQ();
}

function renderQ(){
  const ex = Q.list[Q.i];
  Q.answered = false; Q.built = [];
  const pct = Math.round(Q.i / Q.list.length * 100);
  let body = "";

  if (ex.kind === "spell"){
    body = `<input class="typed" id="tin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="...">
            <button class="cta" id="check">Sprawdź</button>`;
  } else if (ex.kind === "order"){
    body = `<div class="slot" id="slot"><em>Dotknij słów po kolei</em></div>
            <div class="chips" id="chips">${ex.tokens.map((t,i)=>`<button class="chip" data-i="${i}">${esc(t)}</button>`).join("")}</div>
            <button class="cta" id="check">Sprawdź</button>`;
  } else {
    body = `<div class="opts" id="opts">${ex.opts.map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  }

  app.innerHTML = board() + `
    <div class="q-meta"><span>Zadanie ${Q.i+1} / ${Q.list.length}</span><span>${Q.right} : ${Q.wrong}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="q flash">
      <span class="q-tag">${esc(ex.tag)}</span>
      <p class="q-main ${ex.prompt.length > 16 ? "small" : ""}">${esc(ex.prompt)}</p>
      ${ex.sub ? `<p class="q-sub">${esc(ex.sub)}</p>` : ""}
      ${ex.speak ? `<button class="speak" id="sp">🔊 Posłuchaj</button>` : ""}
    </div>
    <div id="body">${body}</div>
    <div id="fb"></div>
    <div class="foot"><button id="quit">Przerwij trening</button></div>`;

  if (ex.speak) document.getElementById("sp").onclick = () => say(ex.speak);
  if (ex.autoSpeak) setTimeout(() => say(ex.speak), 250);
  document.getElementById("quit").onclick = screenHome;

  if (ex.kind === "spell"){
    const inp = document.getElementById("tin");
    inp.focus();
    inp.onkeydown = e => { if (e.key === "Enter") answer(inp.value); };
    document.getElementById("check").onclick = () => answer(inp.value);
  } else if (ex.kind === "order"){
    const slot = document.getElementById("slot");
    const chips = document.getElementById("chips");
    chips.onclick = e => {
      const b = e.target.closest(".chip"); if (!b || b.classList.contains("used") || Q.answered) return;
      b.classList.add("used"); Q.built.push({ t: b.textContent, el: b });
      slot.innerHTML = Q.built.map(x=>`<span class="chip">${esc(x.t)}</span>`).join("");
    };
    slot.onclick = () => {
      if (Q.answered || !Q.built.length) return;
      const last = Q.built.pop(); last.el.classList.remove("used");
      slot.innerHTML = Q.built.length ? Q.built.map(x=>`<span class="chip">${esc(x.t)}</span>`).join("") : "<em>Dotknij słów po kolei</em>";
    };
    document.getElementById("check").onclick = () => answer(Q.built.map(x=>x.t).join(" "));
  } else {
    document.getElementById("opts").onclick = e => {
      const b = e.target.closest(".opt"); if (b && !Q.answered) answer(b.dataset.v, b);
    };
  }
}

const norm = s => String(s||"").trim().toLowerCase().replace(/[.!?,]/g,"").replace(/\s+/g," ");

function answer(val, el){
  if (Q.answered) return;
  Q.answered = true;
  const ex = Q.list[Q.i];
  const ok = norm(val) === norm(ex.correct);
  grade(ex, ok);

  if (ok){ Q.right++; boardMsg = pick(["GOL","ŚWIETNIE","CZYSTA AKCJA","BRAWO"],1)[0]; boardTone = "good"; }
  else   { Q.wrong++; boardMsg = "SPUDŁOWANE"; boardTone = "bad"; }
  const b = document.querySelector(".board-msg");
  if (b){ b.textContent = boardMsg; b.className = "board-msg " + boardTone; }

  if (ex.kind === "en2pl" || ex.kind === "pl2en" || ex.kind === "listen" || ex.kind === "gap"){
    document.querySelectorAll(".opt").forEach(o => {
      if (norm(o.dataset.v) === norm(ex.correct)) o.classList.add("right");
      else if (o === el) o.classList.add("wrong");
      else o.classList.add("mute");
    });
  }
  const chk = document.getElementById("check"); if (chk) chk.remove();

  const full = ex.s ? ex.s.en : (ex.w ? ex.w.en : ex.correct);
  document.getElementById("fb").innerHTML = `
    <div class="fb ${ok?"good":"bad"}">${ok ? "Dobrze!" : "Poprawnie: <b>"+esc(ex.correct)+"</b>"}
      <small>${esc(full)}${ex.s ? " &middot; " + esc(ex.s.pl) : (ex.w ? " &middot; " + esc(ex.w.pl) : "")}</small></div>
    <button class="cta" id="next">${Q.i + 1 < Q.list.length ? "Dalej" : "Koniec meczu"}</button>`;
  say(full);
  document.getElementById("next").onclick = () => {
    Q.i++;
    if (Q.i < Q.list.length) renderQ(); else screenResult();
  };
}

function screenResult(){
  finishSession();
  const gained = Q.right * CFG.xpRight + Q.wrong * CFG.xpWrong;
  const pc = Math.round(Q.right / Q.list.length * 100);
  const head = pc === 100 ? "Mecz bez straty!" : pc >= 80 ? "Wygrane!" : pc >= 50 ? "Remis" : "Trening jeszcze potrzebny";
  boardMsg = "FULL TIME"; boardTone = "";
  app.innerHTML = board() + `
    <div class="result flash">
      <div class="score">${Q.right}:${Q.wrong}</div>
      <h2>${head}</h2>
      <p>Seria ${S.streak} ${S.streak===1?"trening":"treningów"} pod rząd. Najlepsza: ${S.best}.</p>
      <span class="xp">+${gained} punktów</span>
    </div>
    <button class="cta" id="home">Wróć do ekranu głównego</button>
    <button class="ghost" id="again">Jeszcze jedna runda</button>`;
  document.getElementById("home").onclick = screenHome;
  document.getElementById("again").onclick = startSession;
}

function screenParent(){
  const rows = unlockedWords().map(w => {
    const r = rec(w.id);
    const lvl = r.box >= 3 ? 2 : r.box >= 1 ? 1 : 0;
    const lab = ["do pracy","w toku","umie"][lvl];
    return `<tr><td><b>${esc(w.en)}</b></td><td>${esc(w.pl)}</td>
      <td><span class="pill p${lvl}">${lab}</span></td><td style="font-family:var(--mono);font-size:12px;color:var(--chalk-dim)">${r.ok}/${r.ok+r.bad}</td></tr>`;
  }).join("");
  const weak = unlockedWords().filter(w => { const r = rec(w.id); return r.bad >= 2 && r.box < 2; }).map(w => w.en);

  app.innerHTML = board() + `
    <div class="hero">${pitchSVG}
      <span class="eyebrow">Panel rodzica</span>
      <h1>Postęp</h1>
      <p>Start: ${esc(S.started)} &middot; sesji łącznie: ${S.dates.length}</p>
    </div>
    ${weak.length ? `<div class="card"><h3>Do powtórki na sesji tygodniowej</h3><p>${esc(weak.join(", "))}</p></div>` : ""}
    <div class="card">
      <h3>Słowa</h3>
      <table class="tbl"><thead><tr><th>EN</th><th>PL</th><th>Status</th><th>Trafienia</th></tr></thead><tbody>${rows}</tbody></table>
    </div>
    <div class="card">
      <h3>Kopia postępu</h3>
      <p>Skopiuj ten tekst raz w miesiącu. Wklej i użyj "Wczytaj", jeśli zmienisz telefon lub wyczyścisz przeglądarkę.</p>
      <textarea id="dump">${esc(JSON.stringify(S))}</textarea>
      <button class="ghost" id="imp">Wczytaj z pola powyżej</button>
      ${HAS_LS ? "" : `<p class="note">Uwaga: ta przeglądarka nie zapisuje danych lokalnie, postęp zniknie po zamknięciu karty. Na telefonie po dodaniu do ekranu głównego będzie działać normalnie.</p>`}
    </div>
    <div class="card">
      <h3>Reset</h3>
      <p>Usuwa cały postęp i zaczyna od tygodnia 1.</p>
      <button class="ghost" id="rst">Wyczyść wszystko</button>
    </div>
    <div class="foot"><button id="back">Wróć</button></div>`;

  document.getElementById("back").onclick = screenHome;
  document.getElementById("imp").onclick = () => {
    try { const o = JSON.parse(document.getElementById("dump").value); if (!o.items) throw 0;
          S = o; save(S); boardMsg = "WCZYTANO"; screenHome(); }
    catch(e){ boardMsg = "BŁĄD DANYCH"; boardTone = "bad"; screenParent(); }
  };
  document.getElementById("rst").onclick = () => {
    if (confirm("Usunąć cały postęp?")){ S = fresh(); save(S); screenHome(); }
  };
}

/* ---------- 9. GO ---------- */
screenHome();
</script>
